spring:
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    password: ${MYSQL_API_USER_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        # Loads the collections of many videos in one query, not one per video
        default_batch_fetch_size: 100
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${spexflix.keycloak.url}/realms/${spexflix.keycloak.realm}
      client:
        registration:
          fgv-spexflix-service:
            provider: fgv
            client-id: ${API_KEYCLOAK_SERVICE_CLIENT_ID:fgv-spexflix-service}
            client-secret: ${API_KEYCLOAK_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          fgv:
            token-uri: ${spexflix.keycloak.url}/realms/${spexflix.keycloak.realm}/protocol/openid-connect/token
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    locale: sv
  graphql:
    schema:
      printer:
        enabled: true
      introspection:
        enabled: false
    http:
      path: /api/graphql
  ai:
    mcp:
      server:
        name: fgv-spexflix
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /api/mcp
        capabilities:
          resource: false
          prompt: false
          completion: false
        instructions: >-
          Spexflix is FGV's video service for the recordings of the spex. Every call runs with the permissions of
          the signed-in user and returns only the videos and playlists they can see. Every tool only reads: nothing
          is changed, uploaded or processed here, and no tool gives addresses for playing a video, its posters or
          its subtitle files; videos are watched in Spexflix Web, which the webUrl fields link to when Spexflix
          knows its address. A video is about one or more spex, by their ids in Spexipedia; a revival keeps the id
          of its original, so listing the videos of an original also lists those of its revivals. Editors also see
          unpublished, processing and failed videos when they ask for them, with their status.
          Playlists are users' own lists of videos and clips (a chapter of a video): yours and everyone's public ones.

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,metrics,info

server:
  port: 8080
  request:
    header:
      forwarded:
        strategy: framework
  tomcat:
    # tus chunks are at most 50 MB
    max-swallow-size: 60MB

logging:
  file:
    path: ./data/log_data

spexflix:
  # The API's public address, e.g. the MCP endpoint's audience
  imports:
    # Files received through the import API (Spexipedia's docs/content-import.md, section 4)
    root: ${API_IMPORTS_ROOT:./data/imports}
    keep-files: 7d
  base-url: ${API_BASE_URL:https://api.spexflix.fgv.local.nu:8443}
  # Spexflix Web, for links to its pages; empty for none
  web-url: ${API_WEB_URL:}
  time-zone: Europe/Stockholm
  jobs:
    spex-refresh:
      cron-expression: 0 15 3 * * * # Every day at 03:15
    spexipedia-sync:
      cron-expression: 0 */5 * * * * # Every five minutes
    upload-cleanup:
      cron-expression: 0 5 * * * * # Every hour at :05
  keycloak:
    url: ${API_KEYCLOAK_URL:https://auth.fgv.local.nu:8443/auth}
    realm: ${API_KEYCLOAK_REALM:fgv}
  security:
    authorized-parties: ${API_SECURITY_AUTHORIZED_PARTIES:fgv-spexflix,fgv-spexify-service,fgv-spexipedia-service,fgv-content-migration}
  mcp:
    # Only tokens of MCP clients, never the web's, are accepted at /api/mcp
    authorized-parties: ${API_KEYCLOAK_MCP_CLIENT_ID:fgv-spexflix-mcp}
  media:
    root: ${API_MEDIA_ROOT:./data/media}
    max-upload-size: ${API_MAX_UPLOAD_SIZE:50GB}
    # The DNS-only media hostname served by spexflix-media (nginx)
    base-url: ${API_MEDIA_BASE_URL:https://media.spexflix.fgv.local.nu:8443}
    # Shared with spexflix-media, which checks the signed playback addresses
    signing-key: ${API_MEDIA_SIGNING_KEY:}
    link-margin: 4h
  worker:
    enabled: ${API_WORKER_ENABLED:false}
    priority: 10
  spexipedia:
    graphql-url: ${API_SPEXIPEDIA_GRAPHQL_URL:https://api.spexipedia.fgv.local.nu:8443/api/graphql}
    web-url: ${SPEXIPEDIA_WEB_URL:}
    sync-enabled: ${API_SPEXIPEDIA_SYNC_ENABLED:true}
  spexify:
    graphql-url: ${API_SPEXIFY_GRAPHQL_URL:}
  data:
    import-sample-data: ${API_IMPORT_SAMPLE_DATA:false}
    sample-data-size: ${API_SAMPLE_DATA_SIZE:small}
    sample-data-preprocessed: ${API_SAMPLE_DATA_PREPROCESSED:false}

---
spring:
  config:
    activate:
      on-profile: local
  graphql:
    schema:
      introspection:
        enabled: true
  # The password comes from MYSQL_API_USER_PASSWORD, as in the container
  datasource:
    url: jdbc:mysql://localhost:3309/spexflix
    username: spexflix

server:
  port: 8083

management:
  server:
    port: 9003

spexflix:
  web-url: ${API_WEB_URL:http://localhost:3003}
  keycloak:
    url: https://auth.fgv.local.nu:8443/auth
  media:
    base-url: http://localhost:8084
    # A key for development only; every other environment sets API_MEDIA_SIGNING_KEY
    signing-key: ${API_MEDIA_SIGNING_KEY:spexflix-development-signing-key}
  worker:
    enabled: true
