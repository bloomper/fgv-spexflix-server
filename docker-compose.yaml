name: fgv-spexflix-server

services:
  spexflix-mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    command: --log-error=/var/log/mysql/error.log
    environment:
      MYSQL_HOST: localhost
      MYSQL_DATABASE: ${FGV_SPEXFLIX_MYSQL_DATABASE}
      MYSQL_ROOT_USER: ${FGV_SPEXFLIX_MYSQL_ROOT_USER}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/FGV_SPEXFLIX_MYSQL_ROOT_PASSWORD
      MYSQL_USER: ${FGV_SPEXFLIX_MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/FGV_SPEXFLIX_MYSQL_USER_PASSWORD
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    #ports:
    #  - "3309:3306"
    volumes:
      - fgv_spexflix_mysql_data:/var/lib/mysql
      - fgv_spexflix_mysql_log:/var/log/mysql
    secrets:
      - FGV_SPEXFLIX_MYSQL_ROOT_PASSWORD
      - FGV_SPEXFLIX_MYSQL_USER_PASSWORD

  spexflix-media:
    image: 'nginx:1.29-alpine'
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        export API_MEDIA_SIGNING_KEY=$$(cat /run/secrets/API_MEDIA_SIGNING_KEY)
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      SPEXFLIX_WEB_ORIGIN: ${SPEXFLIX_WEB_ORIGIN:-http://localhost:3003}
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - ${SPEXFLIX_DEPLOY:-../fgv-spexflix-deploy}/media/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./data/media/hls:/media/hls:ro
    networks:
      - default
      - fgv
    secrets:
      - API_MEDIA_SIGNING_KEY

  spexflix-api:
    image: 'bloomper/fgv-spexflix-server:develop'
    #platform: linux/arm64
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://spexflix-mysql/${FGV_SPEXFLIX_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${FGV_SPEXFLIX_MYSQL_USER}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9000
      LOGGING_FILE_PATH: /data/log_data
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SPEXFLIX_KEYCLOAK_URL: http://keycloak-server:8080/auth
      API_KEYCLOAK_REALM: ${API_KEYCLOAK_REALM}
      API_KEYCLOAK_ADMIN_CLIENT_ID: ${API_KEYCLOAK_ADMIN_CLIENT_ID}
      API_MEDIA_ROOT: /data/media
      SPEXFLIX_MEDIA_BASE_URL: https://media.spexflix.fgv.local.nu:8443
      API_SPEXREGISTER_GRAPHQL_URL: http://spexregister-api:8080/api/graphql
      API_SPEXIFY_GRAPHQL_URL: ${API_SPEXIFY_GRAPHQL_URL:-}
      API_IMPORT_SAMPLE_DATA: ${API_IMPORT_SAMPLE_DATA:-false}
      API_SAMPLE_DATA_SIZE: ${API_SAMPLE_DATA_SIZE:-small}
      API_SAMPLE_DATA_PREPROCESSED: ${API_SAMPLE_DATA_PREPROCESSED:-false}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak-server:8080/auth/realms/fgv/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.fgv.local.nu:8443/auth/realms/fgv
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000;printf \"GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3;grep -q \"^HTTP/1.1 200\" <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      spexflix-mysql:
        condition: service_healthy
    volumes:
      - fgv_spexflix_api_log:/data/log_data
      - ./data/media:/data/media
    networks:
      - default
      - fgv
    secrets:
      - source: FGV_SPEXFLIX_MYSQL_USER_PASSWORD
        target: MYSQL_API_USER_PASSWORD
      - API_KEYCLOAK_ADMIN_CLIENT_SECRET
      - API_KEYCLOAK_SERVICE_CLIENT_SECRET
      - API_MEDIA_SIGNING_KEY

volumes:
  fgv_spexflix_mysql_data:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexflix-mysql/data
      o: bind
  fgv_spexflix_mysql_log:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexflix-mysql/log
      o: bind
  fgv_spexflix_api_log:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexflix-api/log_data
      o: bind

networks:
  fgv:
    name: fgv-local
    external: true

secrets:
  FGV_SPEXFLIX_MYSQL_ROOT_PASSWORD:
    file: .docker/secrets/FGV_SPEXFLIX_MYSQL_ROOT_PASSWORD
  FGV_SPEXFLIX_MYSQL_USER_PASSWORD:
    file: .docker/secrets/FGV_SPEXFLIX_MYSQL_USER_PASSWORD
  API_KEYCLOAK_ADMIN_CLIENT_SECRET:
    file: .docker/secrets/API_KEYCLOAK_ADMIN_CLIENT_SECRET
  API_KEYCLOAK_SERVICE_CLIENT_SECRET:
    file: .docker/secrets/API_KEYCLOAK_SERVICE_CLIENT_SECRET
  API_MEDIA_SIGNING_KEY:
    file: .docker/secrets/API_MEDIA_SIGNING_KEY
